name: ContosoOrders CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # JOB 1: BUILD THE DACPAC
  build:
    name: Build Database Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.404"

      - name: Build DACPAC
        run: |
          dotnet build DatabaseProjectContosoOrders.sqlproj \
            --configuration Release

      - name: Upload DACPAC
        uses: actions/upload-artifact@v7
        with:
          name: ContosoOrders-DACPAC
          path: bin/Release/DatabaseProjectContosoOrders.dacpac
          if-no-files-found: error
          retention-days: 7

  # JOB 2: TEST THE DATABASE
  test:
    name: Test Database
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.404"

      - name: Download DACPAC
        uses: actions/download-artifact@v8
        with:
          name: ContosoOrders-DACPAC
          path: dacpac

      - name: Install SQL tools
        shell: pwsh
        run: |
          dotnet tool install --global microsoft.sqlpackage `
            --version 170.5.96

          Install-Module SqlServer `
            -RequiredVersion 22.4.5.1 `
            -Scope CurrentUser `
            -Force `
            -AllowClobber

      - name: Start SQL Server
        shell: bash
        run: |
          PASSWORD="Test!$(openssl rand -hex 16)"

          echo "::add-mask::$PASSWORD"
          echo "TEST_SQL_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

          docker run -d \
            --name contoso-sql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$PASSWORD" \
            -p 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server
        shell: pwsh
        run: |
          Import-Module SqlServer

          $connection = "Server=localhost,1433;" +
            "Database=master;" +
            "User ID=sa;" +
            "Password=$env:TEST_SQL_PASSWORD;" +
            "Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"

          $ready = $false

          for ($i = 0; $i -lt 180; $i++) {
            try {
              Invoke-Sqlcmd `
                -ConnectionString $connection `
                -Query "SELECT 1" `
                  -ErrorAction Stop | Out-Null

              $ready = $true
              break
            }
            catch [System.Management.Automation.ParameterBindingException] {
              throw
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $ready) {
            throw "SQL Server did not become ready."
          }

          Write-Host "SQL Server is ready."

      - name: Deploy DACPAC to test database
        shell: pwsh
        run: |
          $connection = "Server=localhost,1433;" +
            "Database=ContosoOrdersTest;" +
            "User ID=sa;" +
            "Password=$env:TEST_SQL_PASSWORD;" +
            "Encrypt=True;TrustServerCertificate=True"

          sqlpackage `
            /Action:Publish `
            /SourceFile:dacpac/DatabaseProjectContosoOrders.dacpac `
            "/TargetConnectionString:$connection" `
            /p:BlockOnPossibleDataLoss=True

          if ($LASTEXITCODE -ne 0) {
            throw "DACPAC deployment failed."
          }

      - name: Run automated SQL tests
        shell: pwsh
        run: |
          Import-Module SqlServer

          $connection = "Server=localhost,1433;" +
            "Database=ContosoOrdersTest;" +
            "User ID=sa;" +
            "Password=$env:TEST_SQL_PASSWORD;" +
            "Encrypt=True;TrustServerCertificate=True"

          Invoke-Sqlcmd `
            -ConnectionString $connection `
            -InputFile "tests/smoke.sql" `
            -AbortOnError `
            -ErrorAction Stop `
            -Verbose

          Write-Host "All database tests passed!"

      - name: Stop test database
        if: always()
        shell: bash
        run: |
          docker rm -f contoso-sql || true
