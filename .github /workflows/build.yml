---
name: Build ContosoOrders

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build DACPAC
        run: dotnet build DatabaseProjectContosoOrders.sqlproj --configuration Release

      - name: Upload DACPAC
        uses: actions/upload-artifact@v4
        with:
          name: ContosoOrders-DACPAC
          path: bin/Release/DatabaseProjectContosoOrders.dacpac
          if-no-files-found: error
